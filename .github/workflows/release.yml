name: VidyutGati Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Signed Release Artifacts
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Rename Artifacts with Tag
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          cp app/build/outputs/apk/release/app-release.apk erickshaw-sarathi-${TAG_NAME}.apk
          cp app/build/outputs/bundle/release/app-release.aab erickshaw-sarathi-${TAG_NAME}.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            erickshaw-sarathi-*.apk
            erickshaw-sarathi-*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
